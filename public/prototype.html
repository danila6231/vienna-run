<title>Vienna Run Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600&family=DM+Mono:wght@400&family=Federo&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1d1411;
  --panel:#281c17;
  --panel-hi:#33241c;
  --line:#3f2e25;
  --ink:#f3e9d6;
  --muted:#b9a892;
  --accent:#e8b62e;
  --accent-ink:#1d1411;
  --red:#d2343b;
  --font-display:"Federo","Didot","Bodoni 72",Georgia,serif;
  --font-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--ink);}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;}
.page{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:18px;}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 32px;}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.2vw,44px);letter-spacing:.03em;margin:0;line-height:1.05;text-wrap:balance;}
h1 em{font-style:normal;color:var(--accent);}
.lede{margin:0;color:var(--muted);max-width:58ch;}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;font:inherit;transition:border-color .15s,background .15s;}
.tab:hover{border-color:#5a4436;}
.tab .letter{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;border:1px solid var(--line);color:var(--muted);}
.tab .name{font-weight:600;line-height:1.3;}
.tab .tag{font-size:13px;color:var(--muted);line-height:1.35;}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--panel-hi);}
.tab[aria-selected="true"] .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[hidden]{display:none!important;}
@media (max-width:700px){.tabs{grid-template-columns:1fr;}}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#0d0908;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;isolation:isolate;container-type:inline-size;}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#retro{image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;background:#000;}
.fx{position:absolute;inset:0;pointer-events:none;}
.grain{opacity:0;mix-blend-mode:multiply;background-size:220px 220px;transition:opacity .2s;}
.mode-a .grain{opacity:.28;}
.scan{opacity:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);}
.mode-c .scan{opacity:.55;}
.vignette{opacity:0;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(60,35,20,.38));}
.mode-a .vignette{opacity:1;}
.flash{opacity:0;box-shadow:inset 0 0 14cqw 3cqw rgba(214,40,40,.85);}
.flash.on{animation:flash .5s ease-out;}
@keyframes flash{from{opacity:1}to{opacity:0}}

.hud{position:absolute;inset:0;pointer-events:none;padding:2.2cqw 2.4cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw;}
.score{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
.score .lbl{font-size:1.15cqw;letter-spacing:.14em;text-transform:uppercase;}
.score b{font-weight:400;font-size:4.2cqw;font-variant-numeric:tabular-nums;}
.route{display:flex;flex-direction:column;align-items:flex-end;gap:.7cqw;width:27cqw;}
.route .lbl{font-size:1.15cqw;letter-spacing:.08em;}
.bar{position:relative;width:100%;height:.9cqw;border-radius:1cqw;overflow:hidden;}
.bar i{position:absolute;inset:0 auto 0 0;width:0%;}

.mode-a .score{background:#fbf3e2;color:#2b1d17;padding:1cqw 1.6cqw 1.1cqw;border-radius:.4cqw;box-shadow:.35cqw .45cqw 0 rgba(60,35,20,.35);transform:rotate(-2deg);font-family:var(--font-display);}
.mode-a .score .lbl{color:#9a3b2b;margin-bottom:.35cqw;}
.mode-a .route{font-family:var(--font-display);color:#2b1d17;background:#fbf3e2;padding:.9cqw 1.3cqw;border-radius:.4cqw;box-shadow:.35cqw .45cqw 0 rgba(60,35,20,.35);transform:rotate(1.2deg);}
.mode-a .bar{background:#e5d8bf;}
.mode-a .bar i{background:#c8102e;}

.mode-b .score{font-family:"Fredoka",var(--font-body);color:#fff;background:#3a7bd5;padding:.9cqw 2cqw 1cqw;border-radius:5cqw;box-shadow:0 .5cqw 0 #23549b;font-weight:700;}
.mode-b .score .lbl{font-weight:600;opacity:.9;}
.mode-b .score b{font-weight:700;font-size:3.8cqw;}
.mode-b .route{font-family:"Fredoka",var(--font-body);font-weight:600;color:#23549b;background:rgba(255,255,255,.92);padding:.9cqw 1.6cqw;border-radius:3cqw;box-shadow:0 .4cqw 0 rgba(35,84,155,.35);}
.mode-b .bar{background:#d6e6fb;}
.mode-b .bar i{background:#f2a33a;}

.mode-c .score,.mode-c .route{font-family:"Press Start 2P",monospace;color:#ffd23f;text-shadow:.25cqw .25cqw 0 #b0185a;}
.mode-c .score .lbl{font-size:1.1cqw;margin-bottom:.6cqw;color:#fff3d6;}
.mode-c .score b{font-size:3cqw;}
.mode-c .route .lbl{font-size:.95cqw;color:#fff3d6;}
.mode-c .bar{background:#2a1840;border-radius:0;box-shadow:0 0 0 .25cqw #fff3d6;}
.mode-c .bar i{background:#ffd23f;}

.pop{position:absolute;transform:translate(-50%,-50%);font-size:3cqw;white-space:nowrap;animation:rise .9s ease-out forwards;pointer-events:none;}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.mode-a .pop{font-family:var(--font-display);color:#2b1d17;background:#fbf3e2;padding:.2cqw 1cqw;border-radius:.3cqw;box-shadow:.25cqw .3cqw 0 rgba(60,35,20,.35);}
.mode-a .pop.minus{color:#fff;background:#b3262d;}
.mode-b .pop{font-family:"Fredoka",var(--font-body);font-weight:700;color:#fff;-webkit-text-stroke:.25cqw #23549b;paint-order:stroke fill;}
.mode-b .pop.minus{-webkit-text-stroke-color:#9b1f25;color:#ffd6d6;}
.mode-c .pop{font-family:"Press Start 2P",monospace;font-size:2.2cqw;color:#ffd23f;text-shadow:.25cqw .25cqw 0 #b0185a;}
.mode-c .pop.minus{color:#ff5a5a;text-shadow:.25cqw .25cqw 0 #2a1840;}

.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:.6cqw;animation:pop .35s ease-out;}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.banner b{font-weight:400;font-size:7cqw;line-height:1;}
.banner span{font-size:2cqw;}
.mode-a .banner{font-family:var(--font-display);color:#2b1d17;background:#fbf3e2;padding:1.6cqw 4cqw;border-top:1.2cqw solid #c8102e;border-bottom:1.2cqw solid #c8102e;box-shadow:.6cqw .8cqw 0 rgba(60,35,20,.35);}
.mode-b .banner{font-family:"Fredoka",var(--font-body);font-weight:700;color:#fff;}
.mode-b .banner b{font-weight:700;-webkit-text-stroke:.5cqw #23549b;paint-order:stroke fill;}
.mode-b .banner span{background:#3a7bd5;padding:.5cqw 2cqw;border-radius:3cqw;}
.mode-c .banner{font-family:"Press Start 2P",monospace;color:#ffd23f;text-shadow:.4cqw .4cqw 0 #b0185a;}
.mode-c .banner b{font-size:5.5cqw;}
.mode-c .banner span{font-size:1.6cqw;color:#fff3d6;}

.hint{position:absolute;left:50%;bottom:1.2cqw;transform:translateX(-50%);pointer-events:none;font-size:1.45cqw;padding:.8cqw 1.8cqw;border-radius:3cqw;background:rgba(20,12,10,.72);color:#fbf3e2;white-space:nowrap;transition:opacity .4s;font-family:var(--font-body);}
.hint.gone{opacity:0;}
.mode-c .hint{font-family:"Press Start 2P",monospace;font-size:1cqw;border-radius:0;background:#2a1840;box-shadow:0 0 0 .25cqw #fff3d6;}
.notice{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--ink);background:#1d1411;font-size:16px;}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 18px var(--font-body);padding:14px 26px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;}

.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;}
.btns{display:flex;flex-wrap:wrap;gap:8px;}
.btn{appearance:none;font:500 14px var(--font-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;}
.btn:hover{border-color:#5a4436;}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);}
.keys{margin:0;color:var(--muted);font-size:13px;}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-inline:2px;background:var(--panel);color:var(--ink);}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--muted);}
.legend b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;}
.legend .neg b{color:#f08a7e;}

/* ---------- comparison ---------- */
.compare h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:10px 0 10px;letter-spacing:.02em;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px;}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line);}
tr:last-child td,tr:last-child th{border-bottom:0;}
thead th{font-weight:600;font-size:14px;background:var(--panel);}
thead th small{display:block;font-weight:400;color:var(--muted);font-size:12px;}
tbody th{font-weight:500;color:var(--muted);width:17%;font-size:13px;letter-spacing:.02em;}
td.on,th.on{background:var(--panel-hi);}
thead th.on{box-shadow:inset 0 3px 0 var(--accent);}
.chip{display:inline-block;margin-left:6px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;vertical-align:2px;}
.note{margin:0;color:var(--muted);font-size:14px;max-width:80ch;}
@media (prefers-reduced-motion: reduce){.pop,.banner,.flash.on{animation-duration:.01s;}}
/* Full-screen prototype: only look A */
html,body{height:100%;margin:0;overflow:hidden;background:#0d0908;}
.stage{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border-radius:0;}
</style>

<div class="stage mode-a" id="stage">
  <canvas id="gl"></canvas>
  <div class="fx vignette"></div>
  <div class="fx grain" id="grain"></div>
  <div class="fx flash" id="flash"></div>
  <div class="hud">
    <div class="score"><span class="lbl">Points</span><b id="score">0</b></div>
    <div class="route"><span class="lbl" id="routeLbl">Stephansplatz → Riesenrad</span><div class="bar"><i id="routeFill"></i></div></div>
  </div>
  <div id="pops"></div>
  <div class="banner" id="banner" hidden><b>Ziel!</b><span id="bannerScore"></span></div>
  <div class="hint" id="hint">Autopilot is playing. Tap left or right, or press ← →, to take over.</div>
  <div class="notice" id="glError" hidden>This browser couldn't start 3D graphics, so the demo can't run here.</div>
  <button class="playbtn" id="playBtn" hidden>Start the demo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   Shared game simulation (identical for all three looks)
   ===================================================================== */
const LANE_W = 2.6;
const ROUTE_LEN = 600;
const BASE_SPEED = 14;
const TYPES = {
  sacher:  { good: true,  pts: 15,  emoji: '🍰' },
  kipferl: { good: true,  pts: 10,  emoji: '🥐' },
  melange: { good: true,  pts: 5,   emoji: '☕' },
  mozart:  { good: true,  pts: 5,   emoji: '🍬' },
  krampus: { good: false, pts: -10, emoji: '👹' },
  bomb:    { good: false, pts: -15, emoji: '💣' },
};
const GOOD = ['sacher', 'kipferl', 'kipferl', 'melange', 'melange', 'melange', 'mozart', 'mozart', 'mozart'];
const BAD = ['krampus', 'bomb'];
const LANDMARKS = [
  { id: 'stephansdom', at: 95,  side: 1,  zone: [-24, 16], name: 'Stephansdom' },
  { id: 'tram',        at: 205, side: -1, zone: null,      name: 'Ring tram' },
  { id: 'karlskirche', at: 300, side: -1, zone: [-24, 16], name: 'Karlskirche' },
  { id: 'hofburg',     at: 440, side: 1,  zone: [-26, 16], name: 'Hofburg' },
  { id: 'riesenrad',   at: ROUTE_LEN, side: 1, zone: [-40, 28], name: 'Riesenrad' },
];
const lapPos = (d) => ((d % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN;
function relLandmark(at, dist) { let r = at - lapPos(dist); while (r < -60) r += ROUTE_LEN; while (r > ROUTE_LEN - 60) r -= ROUTE_LEN; return r; }
function excluded(p, side, extra = 0) {
  const q = lapPos(p);
  for (const lm of LANDMARKS) {
    if (!lm.zone || lm.side !== side) continue;
    for (const off of [0, ROUTE_LEN, -ROUTE_LEN]) { const d = q - (lm.at + off); if (d > lm.zone[0] - extra && d < lm.zone[1] + extra) return true; }
  }
  return false;
}

const START = 30;
const sim = { dist: START, speed: BASE_SPEED, lane: 0, x: 0, items: [], spawnAt: START + 34, score: 0, auto: true, t: 0, stumble: 0, tray: [], botCool: 0, uid: 0 };
let emit = () => {};
function addItem(at, lane, type) { sim.items.push({ at, lane, type, state: 0, t: 0, id: ++sim.uid, obj: null }); }
function spawnPattern(at) {
  const q = lapPos(at);
  if (q > ROUTE_LEN - 36 || q < 22) return 8;
  const r = Math.random();
  if (r < 0.32) { const lane = pick([-1, 0, 1]); const t = pick(GOOD); for (let i = 0; i < 3; i++) addItem(at + i * 4, lane, t); return 12 + rand(5, 9); }
  if (r < 0.6) {
    const lanes = shuffle([-1, 0, 1]);
    addItem(at, lanes[0], pick(BAD));
    if (Math.random() < 0.4) addItem(at, lanes[1], pick(BAD)); else addItem(at + 2, lanes[1], pick(GOOD));
    return rand(11, 15);
  }
  if (r < 0.8) { let lane = pick([-1, 0, 1]); for (let i = 0; i < 3; i++) { addItem(at + i * 5.5, lane, pick(GOOD)); lane = clamp(lane + pick([-1, 1]), -1, 1); } return 17 + rand(3, 6); }
  addItem(at, pick([-1, 0, 1]), pick(GOOD)); return rand(7, 10);
}
function resetSim() {
  for (const it of sim.items) emit('remove', it);
  Object.assign(sim, { dist: START, lane: 0, x: 0, spawnAt: START + 34, score: 0, t: 0, stumble: 0, botCool: 0 });
  sim.items.length = 0; sim.tray.length = 0;
  emit('reset');
}
function stepSim(dt) {
  sim.t += dt;
  const prog = lapPos(sim.dist) / ROUTE_LEN;
  sim.speed = BASE_SPEED * (1 + 0.25 * prog);
  const prev = sim.dist;
  sim.dist += sim.speed * dt;
  if (Math.floor(sim.dist / ROUTE_LEN) > Math.floor(prev / ROUTE_LEN)) { emit('finish', { score: sim.score }); sim.score = 0; sim.tray.length = 0; }
  while (sim.spawnAt < sim.dist + 135) sim.spawnAt += spawnPattern(sim.spawnAt);
  sim.x += (sim.lane - sim.x) * (1 - Math.exp(-dt * 16));
  if (sim.stumble > 0) sim.stumble -= dt;
  for (const it of sim.items) {
    if (it.state !== 0) { it.t += dt; continue; }
    const r = it.at - sim.dist;
    if (r < 0.8 && r > -1.0 && Math.abs(sim.x - it.lane) < 0.5) {
      const T = TYPES[it.type];
      it.state = T.good ? 1 : 2; it.t = 0;
      sim.score = Math.max(0, sim.score + T.pts);
      if (T.good) { sim.tray.push(it.type); if (sim.tray.length > 6) sim.tray.shift(); emit('collect', it); }
      else { sim.stumble = 0.5; sim.tray.pop(); emit('hit', it); }
    }
  }
  let w = 0;
  for (const it of sim.items) { if (it.at - sim.dist > -25) sim.items[w++] = it; else emit('remove', it); }
  sim.items.length = w;
}
function bot(dt) {
  sim.botCool -= dt;
  if (sim.botCool > 0) return;
  const s = [0, 0, 0];
  for (const it of sim.items) {
    if (it.state) continue;
    const r = it.at - sim.dist;
    if (r < 1 || r > 30) continue;
    const T = TYPES[it.type];
    s[it.lane + 1] += T.good ? (T.pts / 5) * (1 - r / 40) : -12 * (1 - r / 36);
  }
  s[sim.lane + 1] += 0.4;
  let best = sim.lane, bs = -Infinity;
  for (let l = -1; l <= 1; l++) { const v = s[l + 1] - Math.abs(l - sim.lane) * 0.3; if (v > bs) { bs = v; best = l; } }
  if (best !== sim.lane && Math.random() > 0.06) { sim.lane += Math.sign(best - sim.lane); sim.botCool = rand(0.16, 0.3); }
  else sim.botCool = 0.08;
}

/* =====================================================================
   Page plumbing: input, HUD, effects
   ===================================================================== */
const stage = $('#stage'), glCanvas = $('#gl'), retroCanvas = $('#retro');
const scoreEl = $('#score'), routeFill = $('#routeFill'), routeLbl = $('#routeLbl');
const hint = $('#hint'), banner = $('#banner'), bannerScore = $('#bannerScore'), flashEl = $('#flash'), pops = $('#pops');
let mode = null;
const modes = {};

function setAuto(on) {
  sim.auto = on;
  hint.textContent = on ? "Autopilot is playing. Tap or press ← → to take over." : "You're playing.";
  hint.classList.remove('gone');
  clearTimeout(setAuto.tm);
  if (!on) setAuto.tm = setTimeout(() => hint.classList.add('gone'), 1600);
}
let lastInput = 0, triedFullscreen = false;
function goFullscreen() {
  if (triedFullscreen) return;
  triedFullscreen = true;
  try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
}
function move(dir) {
  lastInput = performance.now();
  goFullscreen();
  if (sim.auto) setAuto(false);
  sim.lane = clamp(sim.lane + dir, -1, 1);
}
let down = null;
stage.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary || e.target.closest('button')) return;
  const r = stage.getBoundingClientRect();

  function release(it) { if (!it.obj) return; scene.remove(it.obj.sp); scene.remove(it.obj.sh); pool.push(it.obj); it.obj = null; }

  const waiterTex = [tex(paintWaiterA(0)), tex(paintWaiterA(1))];
  const playerMat = new THREE.SpriteMaterial({ map: waiterTex[0], alphaTest: 0.3 });
  const player = new THREE.Sprite(playerMat); player.center.set(0.5, 0); player.scale.set(2.0, 3.0, 1); scene.add(player);
  const pShadow = flat(new THREE.PlaneGeometry(1.9, 0.9), blobMat); pShadow.position.y = 0.035; scene.add(pShadow);
  const stack = [];
  for (let i = 0; i < 6; i++) { const s = new THREE.Sprite(stickerMats.sacher); s.scale.set(0.72, 0.72, 1); s.visible = false; scene.add(s); stack.push(s); }

  const v3 = new THREE.Vector3();
  let px = 0;
  function render(dt) {
    roadTex.offset.y = (sim.dist / 9) % 1;
    walkTex.offset.y = (sim.dist / 3.4) % 1;
    updateRows();
    for (const L of LANDMARKS) {
      const r = relLandmark(L.at, sim.dist);
      const o = lm[L.id];
      o.visible = r > -60 && r < 280;
      o.position.z = -(r + (L.id === 'riesenrad' ? 8 : 0));
      if (L.id === 'riesenrad') { lm.finish.position.z = -r; lm.finish.visible = o.visible; }
    }
    const ang = sim.t * 0.12;
    wheel.rotation.z = ang;
    cabins.forEach((m, i) => { const a = ang + i * TAU / 15; m.position.x = Math.cos(a) * 13.6; m.position.y = Math.sin(a) * 13.6 - 1.1; });
    clouds.forEach((s, i) => { s.position.x += dt * (0.6 + i * 0.1); if (s.position.x > 170) s.position.x = -170; });

    px = sim.x * LANE_W;
    const run = sim.t * 7.5;
    playerMat.map = waiterTex[Math.floor(run) % 2];
    const bob = Math.abs(Math.sin(run * Math.PI)) * 0.12;
    const lean = (sim.lane - sim.x) * 0.35 + (sim.stumble > 0 ? Math.sin(sim.t * 40) * sim.stumble * 0.5 : 0);
    playerMat.rotation = -lean;
    player.position.set(px, bob, 0);
    pShadow.position.x = px;
    const ca = Math.cos(-lean), sa = Math.sin(-lean);
    for (let i = 0; i < 6; i++) {
      const s = stack[i];
      if (i < sim.tray.length) {
        s.visible = true; s.material = stickerMats[sim.tray[i]];
        const lx = 0.48 + Math.sin(i * 2.3) * 0.05, ly = 2.95 + i * 0.36;
        s.position.set(px + lx * ca - ly * sa, bob + lx * sa + ly * ca, 0.1);
      } else s.visible = false;
    }

    for (const it of sim.items) {
      if (!it.obj) it.obj = getObj(it.type);
      const o = it.obj, r = it.at - sim.dist, x = it.lane * LANE_W;
      if (it.state === 0) {
        o.sp.position.set(x, 1.3 + Math.sin(sim.t * 3 + it.id) * 0.16, -r); o.sp.scale.set(1.7, 1.7, 1);
        o.sh.position.set(x, 0.045, -r);
      } else if (it.state === 1) {
        const k = Math.min(1, it.t / 0.3);
        o.sp.position.set(x + (px + 0.5 - x) * k, 1.3 + (3.2 - 1.3) * k, -r * (1 - k)); const s = 1.7 - k; o.sp.scale.set(s, s, 1);
        o.sh.visible = false; if (k >= 1) o.sp.visible = false;
      } else {
        const k = Math.min(1, it.t / 0.25); const s = 1.7 * (1 + k * 0.8);
        o.sp.scale.set(s, s, 1); o.sp.position.y = 1.3 + k; o.sh.visible = false; if (k >= 1) o.sp.visible = false;
      }
    }

    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = (Math.random() - 0.5) * shakeT * 1.4; sy = (Math.random() - 0.5) * shakeT * 1.0; }
    cam.position.set(px * 0.35 + sx, 4.4 + sy, 8.2);
    cam.lookAt(px * 0.3, 1.9, -14);
    renderer.render(scene, cam);
  }
  return {
    cams: [cam], render, on(type, it) { if (type === 'remove') release(it); else if (type === 'reset') resetRows(); },
    playerScreen() { v3.set(px, 3.4, 0).project(cam); return { x: (v3.x + 1) / 2, y: (1 - v3.y) / 2 }; },
  };
}

/* =====================================================================
   Sizing, loop, start (look A only)
   ===================================================================== */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  if (renderer) renderer.setSize(w, h, false);
  for (const k in modes) for (const cam of modes[k].cams || []) { cam.aspect = w / h; cam.updateProjectionMatrix(); }
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);

let running = !reduced, last = performance.now();
const playBtn = $('#playBtn');
if (!running) { playBtn.hidden = false; playBtn.addEventListener('click', () => { running = true; playBtn.hidden = true; last = performance.now(); }); }
document.addEventListener('visibilitychange', () => { last = performance.now(); });
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (document.hidden || !mode) return;
  if (running) {
    // Hand control back to the autopilot after 10 s without input, so the demo never stands still.
    if (!sim.auto && lastInput && performance.now() - lastInput > 10000) setAuto(true);
    if (sim.auto) bot(dt);
    stepSim(dt);
    if (shakeT > 0) shakeT -= dt;
  }
  try { modes[mode].render(running ? dt : 0); } catch (err) { console.error(err); }
  updateHud();
}

async function start() {
  const g = $('#grain'); const url = grainDataUrl(); if (url) g.style.backgroundImage = 'url(' + url + ')';
  try { await Promise.race([Promise.all(['40px Federo', '18px "DM Mono"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch (_) {}
  mode = 'a';
  resetSim();
  modes.a = buildA();
  $('#glError').hidden = !!renderer;
  resize();
  requestAnimationFrame(frame);
}
start();
})();
</script>
